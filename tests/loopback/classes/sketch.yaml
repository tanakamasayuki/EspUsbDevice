profiles:
  p4_loopback:
    fqbn: esp32:esp32:esp32p4:ChipVariant=prev3,USBMode=default,CDCOnBoot=default
    platforms:
      - platform: esp32:esp32 (4.0.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspUsbHost (2.11.1)
  p4_loopback_local:
    fqbn: esp32:esp32:esp32p4:ChipVariant=prev3,USBMode=default,CDCOnBoot=default
    platforms:
      - platform: esp32:esp32 (4.0.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - dir: ../../../../EspUsbHost
  p4x_compile:
    fqbn: esp32:esp32:esp32p4:ChipVariant=postv3,USBMode=default,CDCOnBoot=default
    platforms:
      - platform: esp32:esp32 (4.0.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspUsbHost (2.11.1)
default_profile: p4_loopback
