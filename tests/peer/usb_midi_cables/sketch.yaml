# getMidiPortInfo() is not in a released EspUsbHost yet, so there is no profile
# against a published version - the DUT can only be built from the local checkout.
# Add an `EspUsbHost (x.y.z)` profile once cable discovery ships.
profiles:
  s3_peer_local:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../../EspUsbHost

default_profile: s3_peer_local
