[project]
name = "demo-add-library-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pytest-embedded>=2.0",
    "pytest-embedded-serial>=2.0",
    # >=1.4.1 is load-bearing on this machine, not housekeeping: device lock keys
    # are resolved through symlinks from that version, and every board here is
    # addressed through one (/run/board-identify/by-id/esp32-p4-... ->
    # /dev/ttyACM2). Before it, a second project referring to the same physical
    # board by a different path took a different lock and both runs drove it at
    # once.
    # 1.5.0 and 1.5.1 no longer exist: they carried the DUT lifecycle commands,
    # which were retracted once it was shown that an autouse cleanup fixture in a
    # test file does the same job and reaches peers too. They were removed from
    # PyPI rather than yanked, so a pin naming them cannot resolve at all - which
    # is why this floor went 1.5.1 -> 1.4.1 -> 1.6.0 within a day.
    "pytest-embedded-arduino-cli>=1.6.0",
    "pytest-html>=4.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:record_xml_attribute is an experimental feature:pytest.PytestExperimentalApiWarning",
]
addopts = "--save-state"
