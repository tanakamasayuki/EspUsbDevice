name: Build Check
# A manual run's title says which Arduino-ESP32 core it built with, so the list
# of runs tells them apart; a push or a pull request keeps its usual title.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Build Check - Arduino-ESP32 {0}', inputs.core_version || 'pinned')
      || github.event_name == 'pull_request' && github.event.pull_request.title
      || github.event.head_commit.message }}

# Compile current examples for their declared profiles, without boards.
# This checks API/build compatibility; physical USB coverage lives in tests/.

on:
  push:
    branches: [main, master, v3]
    paths:
      - "src/**"
      - "examples/**"
      - "tools/build_check.py"
      - ".github/workflows/build-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "tools/build_check.py"
      - ".github/workflows/build-check.yml"
  workflow_dispatch:
    inputs:
      core_version:
        # Build against another Arduino-ESP32 release (e.g. 3.3.13) without
        # changing the repository: every example's sketch.yaml is rewritten in
        # the runner before the build. Empty keeps the pinned version.
        description: "Arduino-ESP32 core version to build with (empty = pinned)"
        required: false
        default: ""

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.profile }} (${{ inputs.core_version || 'pinned core' }})
    runs-on: ubuntu-latest
    strategy:
      # A build matrix is a coverage report: one red cell must not cancel the
      # others, or a single failure hides the state of every other target.
      fail-fast: false
      matrix:
        # S3 is the development bench. S2/P4 jobs provide compile coverage only.
        profile: [esp32s3, esp32p4, esp32p4x, esp32s2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache the Arduino platform and tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          # Keyed on the sketch.yaml files because they pin the platform and
          # library versions: a job that is not bumping either should not
          # download a toolchain again.
          key: arduino-${{ runner.os }}-${{ matrix.profile }}-${{ inputs.core_version }}-${{ hashFiles('examples/**/sketch.yaml') }}
          restore-keys: |
            arduino-${{ runner.os }}-${{ matrix.profile }}-${{ inputs.core_version }}-

      - name: Use the requested core version
        if: ${{ inputs.core_version != '' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
        run: |
          if ! [[ "$CORE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::core_version must look like 3.3.13 or 4.0.0-RC1, got '$CORE_VERSION'"
            exit 1
          fi
          find examples -name sketch.yaml -print0 |
            xargs -0 sed -i -E "s/esp32:esp32 \([^)]*\)/esp32:esp32 ($CORE_VERSION)/"
          grep -rhoE "esp32:esp32 \([^)]*\)" --include=sketch.yaml examples | sort | uniq -c
          echo "Built with Arduino-ESP32 $CORE_VERSION (the repository pins another version)." >> "$GITHUB_STEP_SUMMARY"

      - name: Update the Arduino library index
        # sketch.yaml pins library versions, which arduino-cli resolves against
        # the library index. A cache restored through restore-keys can hold an
        # index from before a pinned version was published, which surfaces as
        # "Library 'EspUsbHost' not found" and then a missing header. Refreshing
        # after the restore keeps this independent of cache state.
        run: arduino-cli lib update-index

      - name: Build examples (${{ matrix.profile }})
        run: python3 tools/build_check.py ${{ matrix.profile }}
