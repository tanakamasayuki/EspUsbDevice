profiles:
  p4_psram:
    fqbn: esp32:esp32:esp32p4:ChipVariant=prev3,PSRAM=enabled,USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspUsbHost (2.10.1)
  p4x_psram_compile:
    fqbn: esp32:esp32:esp32p4:ChipVariant=postv3,PSRAM=enabled,USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspUsbHost (2.10.1)
default_profile: p4_psram
